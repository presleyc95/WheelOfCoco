<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Coco Are You?</title>
<meta name="description" content="Pull the lever. The house decides which Coco you are today.">
<link rel="icon" href="cocos.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #0d3b2a;
    --felt-dark: #06241a;
    --gold: #e9c46a;
    --gold-bright: #ffe39a;
    --gold-deep: #a87c2a;
    --red: #b3261e;
    --ink: #f6ecd2;
    --muted: #c9b98f;
    --reel: 120px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, rgba(233,196,106,.18), transparent 60%),
      radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }

  header { text-align: center; margin-bottom: 20px; }
  .marquee {
    display: inline-block;
    padding: 14px 28px;
    border: 3px solid var(--gold);
    border-radius: 14px;
    background: linear-gradient(#2a1405, #120802);
    box-shadow: 0 0 0 6px #2a1405, 0 0 30px rgba(233,196,106,.45);
    position: relative;
  }
  .marquee::before {
    content: "";
    position: absolute; inset: -12px;
    border-radius: 20px;
    background:
      radial-gradient(circle, var(--gold-bright) 0 3px, transparent 4px) 0 0 / 22px 22px;
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    padding: 4px;
    animation: blink 1.2s steps(2) infinite;
    opacity: .9;
  }
  @keyframes blink { 50% { background-position: 11px 0; } }
  h1 {
    font-family: "Cinzel Decorative", serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 52px);
    margin: 0;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 50%, var(--gold-deep));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  .tagline { color: var(--muted); margin: 14px 0 0; font-size: 15px; }

  /* ---------- Machine ---------- */
  .machine-wrap { display: flex; align-items: center; gap: 10px; max-width: 100%; }
  .machine {
    background: linear-gradient(160deg, #6b4a12, #3a2306 40%, #5a3c0e);
    border: 4px solid var(--gold);
    border-radius: 24px;
    padding: 18px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.6), 0 20px 50px rgba(0,0,0,.6);
    max-width: 100%;
  }
  .reels {
    display: flex; gap: 10px;
    padding: 12px;
    background: #120802;
    border-radius: 14px;
    border: 2px solid var(--gold-deep);
    position: relative;
  }
  .reels::after { /* payline */
    content: ""; position: absolute; left: 4px; right: 4px; top: 50%;
    height: 2px; background: rgba(179,38,30,.8); box-shadow: 0 0 8px var(--red);
    pointer-events: none;
  }
  .reel {
    width: var(--reel); height: var(--reel);
    overflow: hidden; border-radius: 10px;
    background: #f5e7c0;
    position: relative;
    box-shadow: inset 0 10px 14px rgba(0,0,0,.55), inset 0 -10px 14px rgba(0,0,0,.55);
  }
  .reel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(rgba(0,0,0,.45), transparent 25%, transparent 75%, rgba(0,0,0,.45));
    pointer-events: none;
  }
  .strip { will-change: transform; }
  .tile {
    width: var(--reel); height: var(--reel);
    background-image: url("cocos.webp");
    background-repeat: no-repeat;
    border-bottom: 2px solid #3a2306;
  }
  .reel.win { animation: glow .5s ease-in-out 4 alternate; }
  @keyframes glow { to { box-shadow: 0 0 24px 6px var(--gold-bright); } }

  .lever {
    width: 34px; height: 210px; position: relative;
    cursor: pointer; flex: none;
    background: none; border: 0; padding: 0;
  }
  .lever .base {
    position: absolute; bottom: 0; left: 4px; width: 26px; height: 44px;
    background: linear-gradient(90deg, #6b4a12, var(--gold), #6b4a12);
    border-radius: 6px;
  }
  .lever .arm {
    position: absolute; left: 13px; bottom: 30px; width: 8px; height: 150px;
    background: linear-gradient(90deg, #888, #eee, #888);
    border-radius: 4px; transform-origin: bottom center;
    transition: transform .25s ease-in;
  }
  .lever .knob {
    position: absolute; top: -18px; left: -9px; width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff7b6e, var(--red) 55%, #5a0e09);
    box-shadow: 0 3px 6px rgba(0,0,0,.5);
  }
  .lever.pulled .arm { transform: scaleY(-.55); }
  .lever:disabled { cursor: default; }

  .controls {
    margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  input[type=text] {
    font: 600 16px Inter, sans-serif;
    padding: 12px 14px; border-radius: 10px;
    border: 2px solid var(--gold-deep); background: #120802; color: var(--ink);
    width: 220px; max-width: 100%;
  }
  input[type=text]:focus { outline: none; border-color: var(--gold-bright); }
  .spin-btn {
    font: 700 18px Cinzel, serif; letter-spacing: 2px;
    padding: 12px 26px; border-radius: 10px; border: 0; cursor: pointer;
    color: #2a1405;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 50%, var(--gold-deep));
    box-shadow: 0 4px 0 #6b4a12, 0 8px 18px rgba(0,0,0,.4);
  }
  .spin-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b4a12; }
  .spin-btn:disabled { filter: grayscale(.6) brightness(.8); cursor: default; }
  .credits { text-align: center; margin-top: 12px; color: var(--muted); font-size: 13px; }

  /* ---------- Result ---------- */
  .result {
    margin-top: 28px; width: 100%; max-width: 560px;
    background: linear-gradient(#1d0f04, #0c0601);
    border: 3px solid var(--gold); border-radius: 18px;
    padding: 24px; text-align: center;
    box-shadow: 0 0 40px rgba(233,196,106,.25);
    display: none;
  }
  .result.show { display: block; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .result .kicker { font: 700 13px Cinzel, serif; letter-spacing: 3px; color: var(--muted); }
  .result .portrait {
    width: 180px; height: 180px; margin: 14px auto;
    border-radius: 50%; border: 4px solid var(--gold);
    background-image: url("cocos.webp"); background-repeat: no-repeat;
    box-shadow: 0 0 0 6px #2a1405, 0 0 30px rgba(233,196,106,.6);
  }
  .result h2 {
    font-family: "Cinzel Decorative", serif; font-size: clamp(26px, 6vw, 38px);
    margin: 4px 0; color: var(--gold-bright);
  }
  .result .rarity {
    display: inline-block; font: 700 12px Inter, sans-serif; letter-spacing: 2px;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
    background: var(--gold-deep); color: #120802;
  }
  .result .rarity.legendary { background: linear-gradient(90deg, #7b2ff7, #f107a3); color: #fff; }
  .result .rarity.bust { background: #4a4a4a; color: #ddd; }
  .result.bust { border-color: #6b6b6b; box-shadow: 0 0 30px rgba(0,0,0,.5); }
  .result.bust .portrait { filter: grayscale(1) brightness(.6); border-color: #6b6b6b; box-shadow: 0 0 0 6px #1a1a1a; }
  .result.bust h2 { color: #bbb; }
  .result p { line-height: 1.55; margin: 8px 0; }
  .stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .stat {
    background: #2a1405; border: 1px solid var(--gold-deep); border-radius: 10px;
    padding: 8px 12px; min-width: 120px;
  }
  .stat b { display: block; font-family: Cinzel, serif; color: var(--gold); font-size: 18px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .house { font-size: 13px; color: var(--muted); margin-top: 16px; font-style: italic; }

  /* ---------- Paytable ---------- */
  details.paytable {
    margin-top: 28px; width: 100%; max-width: 560px;
    border: 1px solid var(--gold-deep); border-radius: 12px; background: rgba(0,0,0,.25);
  }
  details.paytable summary {
    cursor: pointer; padding: 12px 16px; font: 700 15px Cinzel, serif; color: var(--gold);
  }
  .pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 0 16px 16px; }
  .pay-item { text-align: center; font-size: 12px; color: var(--muted); }
  .pay-item .tile { width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%; border: 2px solid var(--gold-deep); }
  .pay-item strong { display: block; color: var(--ink); font-size: 13px; }

  /* coins */
  .coin {
    position: fixed; top: -40px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-bright), var(--gold) 50%, var(--gold-deep));
    border: 2px solid #8a6420;
    pointer-events: none; z-index: 50;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 520px) {
    :root { --reel: 84px; }
    .machine { padding: 12px; }
    .reels { gap: 6px; padding: 8px; }
    .lever { height: 160px; }
    .lever .arm { height: 105px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee::before, .coin { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="marquee"><h1>What Coco Are You?</h1></div>
  <p class="tagline">Pull the lever. The house decides who you are today.</p>
</header>

<div class="machine-wrap">
  <div class="machine">
    <div class="reels" id="reels"></div>
  </div>
  <button class="lever" id="lever" aria-label="Pull the lever">
    <div class="base"></div>
    <div class="arm"><div class="knob"></div></div>
  </button>
</div>

<div class="controls">
  <input type="text" id="name" placeholder="Your name, designer" maxlength="40" autocomplete="off">
  <button class="spin-btn" id="spin">SPIN</button>
</div>
<div class="credits" id="credits">One fortune per designer per day. No refunds.</div>

<section class="result" id="result" aria-live="polite">
  <div class="kicker" id="r-kicker">TODAY YOU ARE</div>
  <div class="portrait" id="r-portrait"></div>
  <h2 id="r-name"></h2>
  <div class="rarity" id="r-rarity"></div>
  <p id="r-desc"></p>
  <div class="stats">
    <div class="stat"><b id="r-number"></b><span>Lucky number</span></div>
    <div class="stat"><b id="r-odds"></b><span>Odds</span></div>
    <div class="stat"><b id="r-power"></b><span>Power move</span></div>
  </div>
  <div class="house" id="r-house"></div>
</section>

<details class="paytable">
  <summary>Paytable: meet the Cocos</summary>
  <div class="pay-grid" id="paytable"></div>
</details>

<script>
  // Crop boxes are squares in the 799x535 source image: [x, y, size]
  const IMG_W = 799, IMG_H = 535;
  const COCOS = [
    { id: "dj", name: "DJ Coco", crop: [8, 150, 108], weight: 16, rarity: "COMMON",
      desc: "Headphones on, notifications off. You are locked in and the beat goes on. Today you ship.",
      power: "Do Not Disturb" },
    { id: "rodeo", name: "Rodeo Coco", crop: [72, 120, 112], weight: 16, rarity: "COMMON",
      desc: "Pink hat, big energy. You will wrangle that backlog like a wild stallion. Yeehaw.",
      power: "Lasso the redlines" },
    { id: "tundra", name: "Tundra Coco", crop: [162, 105, 115], weight: 16, rarity: "COMMON",
      desc: "Cool under pressure. Scope creep, surprise deadlines, angry reviewers: none of it rattles you.",
      power: "Ice-cold focus" },
    { id: "highroller", name: "High Roller Coco", crop: [335, 92, 132], weight: 15, rarity: "RARE",
      desc: "You sit on the throne and guard the golden chest. The house always wins, and today you ARE the house.",
      power: "Double down" },
    { id: "elder", name: "Elder Coco", crop: [478, 95, 132], weight: 15, rarity: "RARE",
      desc: "Ancient wisdom flows through the beard. People will come to you with questions, and you will have answers.",
      power: "Tribal knowledge" },
    { id: "mystic", name: "Mystic Coco", crop: [622, 88, 140], weight: 15, rarity: "RARE",
      desc: "The shades see what others cannot. Trust your gut on every design call. The scepter does not lie.",
      power: "Foresight" },
    { id: "shadow", name: "Shadow Coco", crop: [592, 322, 128], weight: 7, rarity: "LEGENDARY",
      desc: "The forbidden Coco. Few have rolled it. Speak little, judge everything, and walk the halls unseen.",
      power: "Vanish from meetings" },
  ];
  const TOTAL_WEIGHT = COCOS.reduce((s, c) => s + c.weight, 0);
  const COCO_CHANCE = 0.10; // the other 90% of the time, no Coco
  const chanceOf = c => COCO_CHANCE * c.weight / TOTAL_WEIGHT;
  const BUST = {
    name: "No Coco Today", crop: [345, 255, 150],
    lines: [
      "The chest stays locked. The Cocos have looked upon you and said nothing.",
      "The house wins. You are merely a person today, and that is fine.",
      "The throne room is closed to you. Do your work like a regular mortal.",
      "Not a single Coco answered the call. Try again tomorrow.",
      "The reels did not align. Somewhere, a Coco is laughing.",
    ],
  };

  function cropStyle(el, coco) {
    const [x, y, s] = coco.crop;
    el.style.backgroundSize = (IMG_W / s * 100) + "% auto";
    el.style.backgroundPosition = (x / (IMG_W - s) * 100) + "% " + (y / (IMG_H - s) * 100) + "%";
  }

  // Deterministic RNG: same name + same day = same Coco
  function hash(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    return h1 >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fortuneFor(name) {
    const rng = mulberry32(hash(name.trim().toLowerCase() + "|" + today()));
    const lucky = 1 + Math.floor(rng() * 99);
    if (rng() >= COCO_CHANCE) return { coco: null, lucky, bustLine: BUST.lines[Math.floor(rng() * BUST.lines.length)] };
    let roll = rng() * TOTAL_WEIGHT, pick = COCOS[0];
    for (const c of COCOS) { if ((roll -= c.weight) < 0) { pick = c; break; } }
    return { coco: pick, lucky };
  }

  // Build reels
  const REELS = 3, STRIP_LEN = 40;
  const reelsEl = document.getElementById("reels");
  const reels = [];
  for (let i = 0; i < REELS; i++) {
    const reel = document.createElement("div");
    reel.className = "reel";
    const strip = document.createElement("div");
    strip.className = "strip";
    reel.appendChild(strip);
    reelsEl.appendChild(reel);
    reels.push({ reel, strip });
    fillStrip(strip, COCOS[(i * 2 + 3) % COCOS.length], Math.random);
  }
  function fillStrip(strip, target, rng) {
    strip.innerHTML = "";
    strip.style.transition = "none";
    strip.style.transform = "translateY(0)";
    // first tile = target (shown at end after scrolling to top), rest random
    const tiles = [target];
    for (let i = 1; i < STRIP_LEN; i++) tiles.push(COCOS[Math.floor(rng() * COCOS.length)]);
    for (const c of tiles) {
      const t = document.createElement("div");
      t.className = "tile";
      cropStyle(t, c);
      strip.appendChild(t);
    }
  }

  // Paytable
  const pay = document.getElementById("paytable");
  for (const c of COCOS) {
    const item = document.createElement("div");
    item.className = "pay-item";
    const t = document.createElement("div");
    t.className = "tile"; cropStyle(t, c);
    item.appendChild(t);
    item.insertAdjacentHTML("beforeend", `<strong>${c.name}</strong>${c.rarity} · ${(chanceOf(c) * 100).toFixed(1)}%`);
    pay.appendChild(item);
  }
  {
    const item = document.createElement("div");
    item.className = "pay-item";
    const t = document.createElement("div");
    t.className = "tile"; cropStyle(t, BUST); t.style.filter = "grayscale(1) brightness(.6)";
    item.appendChild(t);
    item.insertAdjacentHTML("beforeend", `<strong>No Coco</strong>BUST · ${((1 - COCO_CHANCE) * 100).toFixed(0)}%`);
    pay.appendChild(item);
  }

  // Wiring
  const nameEl = document.getElementById("name");
  const spinBtn = document.getElementById("spin");
  const lever = document.getElementById("lever");
  const resultEl = document.getElementById("result");
  const creditsEl = document.getElementById("credits");
  try { nameEl.value = localStorage.getItem("coco-name") || ""; } catch (e) {}

  let spinning = false;
  function spin() {
    if (spinning) return;
    const name = nameEl.value.trim();
    if (!name) {
      nameEl.focus();
      creditsEl.textContent = "The house needs a name before you play.";
      return;
    }
    try { localStorage.setItem("coco-name", name); } catch (e) {}
    spinning = true;
    spinBtn.disabled = lever.disabled = true;
    lever.classList.add("pulled");
    setTimeout(() => lever.classList.remove("pulled"), 350);
    resultEl.classList.remove("show");
    creditsEl.textContent = "Rolling the bones...";

    const fortune = fortuneFor(name);
    const { coco } = fortune;
    // On a bust, land on three different faces so it never looks like a match
    const stops = coco ? [coco, coco, coco]
      : [...COCOS].sort(() => Math.random() - 0.5).slice(0, REELS);
    const tileH = reels[0].reel.clientHeight + 2; // + border
    reels.forEach(({ reel, strip }, i) => {
      reel.classList.remove("win");
      fillStrip(strip, stops[i], Math.random);
      // start at bottom, scroll up to the target tile at index 0
      const start = -(STRIP_LEN - 1) * tileH;
      strip.style.transform = `translateY(${start}px)`;
      strip.offsetHeight; // reflow
      strip.style.transition = `transform ${2.2 + i * 0.7}s cubic-bezier(.15,.85,.25,1.02)`;
      strip.style.transform = "translateY(0)";
    });

    setTimeout(() => {
      showResult(name, fortune);
      if (coco) {
        reels.forEach(r => r.reel.classList.add("win"));
        rainCoins(coco.rarity === "LEGENDARY" ? 90 : coco.rarity === "RARE" ? 50 : 30);
        creditsEl.textContent = "JACKPOT! Spin again all you like. The house has already decided.";
      } else {
        creditsEl.textContent = "BUST. Spin again all you like. The house has already decided.";
      }
      spinning = false;
      spinBtn.disabled = lever.disabled = false;
    }, (2.2 + (REELS - 1) * 0.7) * 1000 + 100);
  }

  function showResult(name, { coco, lucky, bustLine }) {
    const portrait = document.getElementById("r-portrait");
    const rar = document.getElementById("r-rarity");
    resultEl.classList.toggle("bust", !coco);
    document.getElementById("r-number").textContent = lucky;
    if (coco) {
      cropStyle(portrait, coco);
      document.getElementById("r-kicker").textContent = "TODAY YOU ARE";
      document.getElementById("r-name").textContent = coco.name;
      rar.textContent = coco.rarity;
      rar.className = "rarity" + (coco.rarity === "LEGENDARY" ? " legendary" : "");
      document.getElementById("r-desc").textContent = coco.desc;
      document.getElementById("r-odds").textContent = "1 in " + Math.round(1 / chanceOf(coco));
      document.getElementById("r-power").textContent = coco.power;
    } else {
      cropStyle(portrait, BUST);
      document.getElementById("r-kicker").textContent = "THE HOUSE WINS";
      document.getElementById("r-name").textContent = BUST.name;
      rar.textContent = "BUST";
      rar.className = "rarity bust";
      document.getElementById("r-desc").textContent = bustLine;
      document.getElementById("r-odds").textContent = "9 in 10";
      document.getElementById("r-power").textContent = "Try tomorrow";
    }
    document.getElementById("r-house").textContent =
      `${name}, your fortune for ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })} is sealed. Come back tomorrow.`;
    resultEl.classList.add("show");
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function rainCoins(n) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < n; i++) {
      const c = document.createElement("div");
      c.className = "coin";
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
      c.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(c);
      c.addEventListener("animationend", () => c.remove());
    }
  }

  spinBtn.addEventListener("click", spin);
  lever.addEventListener("click", spin);
  nameEl.addEventListener("keydown", e => { if (e.key === "Enter") spin(); });
</script>
</body>
</html>
